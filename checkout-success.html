<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Confirmed | LEXORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f7f4ee; --panel: #fff; --ink: #171717; --muted: #5f5d59; --line: #e4dfd7; --gold: #b38a4b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: Manrope, sans-serif; }
    .panel { width: min(100%, 680px); padding: clamp(28px, 6vw, 64px); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(23, 23, 23, .08); }
    .eyebrow { margin: 0 0 12px; color: var(--gold); font: 500 .75rem 'DM Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font: 700 clamp(2.2rem, 6vw, 4rem)/1.05 'Playfair Display', serif; letter-spacing: -.04em; }
    p { color: var(--muted); line-height: 1.7; }
    .status { margin: 24px 0; padding: 16px; background: #f5efe5; border: 1px solid #e3d4b2; }
    .status.error { background: #fff3f3; border-color: #eccaca; color: #a72828; }
    .order { display: grid; gap: 8px; margin: 24px 0; padding: 18px; background: #faf9f6; border: 1px solid var(--line); }
    .order strong { font-size: 1.05rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .button { display: inline-flex; justify-content: center; padding: 14px 20px; border: 1px solid var(--ink); background: var(--ink); color: white; text-decoration: none; font-weight: 700; }
    .button.secondary { background: transparent; color: var(--ink); }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">Payment confirmed</p>
    <h1>Thank you for your order.</h1>
    <p id="intro">We are verifying your payment securely with your payment provider.</p>
    <div id="status" class="status" role="status" aria-live="polite">Checking payment status...</div>
    <div id="order" class="order" hidden>
      <span>Order reference</span>
      <strong id="orderId"></strong>
    </div>
    <div class="actions">
      <a class="button" href="shop.html">Continue shopping</a>
      <a class="button secondary" href="index.html">Return home</a>
    </div>
  </main>
  <script>
    const apiBase = 'http://localhost:4000';
    const status = document.getElementById('status');
    const order = document.getElementById('order');
    const orderId = document.getElementById('orderId');
    const params = new URLSearchParams(window.location.search);
    const provider = params.get('provider') || (params.get('token') ? 'paypal' : 'stripe');
    const paymentMethod = params.get('method') || 'paypal';
    const sessionId = params.get('session_id');
    const paypalOrderId = params.get('paypal_order_id') || params.get('token');

    async function verifyPayment() {
      const response = provider === 'paypal'
        ? await fetch(`${apiBase}/api/paypal/capture-order`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guest: true, paypalOrderId }) })
        : await fetch(`${apiBase}/api/checkout/session/${encodeURIComponent(sessionId || '')}`);
      const payload = await response.json();
      if (!response.ok || payload?.data?.paymentStatus !== 'paid' || !payload?.data?.order) {
        throw new Error(payload.error || `${provider === 'paypal' ? 'PayPal payment' : 'Stripe payment'} could not be verified yet.`);
      }
      localStorage.removeItem('lexora-cart');
      localStorage.removeItem('lexora-inventory-reservation');
      status.textContent = `Your ${provider === 'paypal' ? (paymentMethod === 'card' ? 'PayPal card' : 'PayPal') : 'Stripe'} payment is verified and your order has been recorded.`;
      status.className = 'status';
      order.hidden = false;
      orderId.textContent = payload.data.order.id;
    }

    verifyPayment().catch(error => {
      status.textContent = error.message || 'Payment verification failed. Please contact support before placing another order.';
      status.className = 'status error';
    });
  </script>
</body>
</html>
