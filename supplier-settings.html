<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Settings | LEXORA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f5f3ee; color: #141414; }
    .settings-shell { max-width: 1080px; margin: 32px auto; padding: 0 20px 72px; }
    .settings-topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 42px; }
    .settings-topbar .brand { color: #111; }
    .settings-actions, .form-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .settings-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .settings-heading h1 { margin: 4px 0 8px; font: 700 40px/1.05 Georgia, serif; }
    .settings-heading p:last-child { margin: 0; color: #666; }
    .settings-panel { padding: 26px; border: 1px solid rgba(17,17,17,.1); background: #fff; }
    .profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px 22px; }
    .profile-grid label { display: flex; flex-direction: column; gap: 8px; color: #4b4b4b; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .profile-grid input, .profile-grid textarea, .profile-grid select { width: 100%; border: 1px solid rgba(17,17,17,.18); padding: 12px 14px; color: #141414; background: #fff; font: inherit; text-transform: none; letter-spacing: 0; }
    .profile-grid textarea { min-height: 130px; resize: vertical; }
    .profile-grid select[multiple] { min-height: 174px; padding: 6px; }
    .profile-grid option { padding: 6px 8px; }
    .wide { grid-column: 1 / -1; }
    .logo-preview { width: 96px; height: 96px; margin-top: 6px; padding: 8px; border: 1px solid rgba(17,17,17,.1); object-fit: contain; background: #f5f3ee; }
    .logo-preview[hidden] { display: none; }
    .settings-footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(17,17,17,.08); }
    .form-status { min-height: 22px; margin: 0; color: #4b4b4b; }
    .form-status.error { color: #8f2d2d; }
    .status-pill { display: inline-flex; align-items: center; padding: 8px 11px; background: rgba(17,17,17,.07); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .status-pill.good { color: #1b754b; background: rgba(27,117,75,.09); }
    .auth-message { padding: 24px; border: 1px solid rgba(17,17,17,.1); background: #fff; }
    .auth-message[hidden], #profileView[hidden] { display: none; }
    @media (max-width: 700px) {
      .settings-heading { align-items: flex-start; flex-direction: column; }
      .profile-grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      .settings-footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="settings-shell">
    <header class="settings-topbar">
      <a class="brand" href="index.html" aria-label="LEXORA home"><span class="brand-mark">L</span><span>LEXORA</span></a>
      <div class="settings-actions">
        <a class="text-button" href="supplier-dashboard.html">Dashboard ↗</a>
        <button id="settingsSignOut" class="text-button" type="button" hidden>Sign out</button>
      </div>
    </header>

    <section id="authNotice" class="auth-message" role="status" hidden>
      <p class="eyebrow">SUPPLIER ACCESS</p>
      <h1>Store settings</h1>
      <p id="authMessage">Sign in with a supplier account to manage this store profile.</p>
      <a class="button button-dark" href="supplier-dashboard.html">Open supplier dashboard <span>↗</span></a>
    </section>

    <section id="profileView" hidden>
      <div class="settings-heading">
        <div>
          <p class="eyebrow">STORE SETTINGS</p>
          <h1>Your public profile.</h1>
          <p>Keep your business details current for buyers and trade partners.</p>
        </div>
        <span id="verificationStatus" class="status-pill">Verification status</span>
      </div>

      <form id="supplierProfileForm" class="settings-panel">
        <div class="profile-grid">
          <label>Store / company name
            <input id="businessName" name="businessName" maxlength="120" autocomplete="organization" required />
          </label>
          <label>Business email
            <input id="businessEmail" name="businessEmail" type="email" maxlength="254" autocomplete="email" />
          </label>
          <label>Phone
            <input id="phone" name="phone" type="tel" maxlength="40" autocomplete="tel" />
          </label>
          <label>Store logo URL
            <input id="logoUrl" name="logoUrl" type="url" maxlength="2048" placeholder="https://example.com/logo.png" />
            <img id="logoPreview" class="logo-preview" alt="Store logo preview" hidden />
          </label>
          <label class="wide">Business description
            <textarea id="businessDescription" name="businessDescription" maxlength="3000"></textarea>
          </label>
          <label>Country
            <input id="country" name="country" maxlength="100" autocomplete="country-name" />
          </label>
          <label>State / Province
            <input id="state" name="state" maxlength="100" autocomplete="address-level1" />
          </label>
          <label>City
            <input id="city" name="city" maxlength="100" autocomplete="address-level2" />
          </label>
          <label>Business address
            <input id="businessAddress" name="businessAddress" maxlength="255" autocomplete="street-address" />
          </label>
          <label class="wide">Business categories
            <select id="categories" name="categories" multiple size="6" aria-describedby="categoryHelp"></select>
            <span id="categoryHelp" class="muted">Select all categories that describe your business.</span>
          </label>
        </div>
        <div class="settings-footer">
          <p id="profileMessage" class="form-status" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <a id="publicStoreLink" class="link-button" href="#" target="_blank" rel="noopener" hidden>View public storefront ↗</a>
            <button id="saveProfileButton" class="button button-dark" type="submit">Save store profile</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <script src="supplier-session.js"></script>
  <script src="supplier-settings.js"></script>
</body>
</html>
