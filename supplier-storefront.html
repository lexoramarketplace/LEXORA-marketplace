<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier Storefront | LEXORA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f5f3ee; color: #141414; }
    .storefront-shell { max-width: 1180px; margin: 32px auto; padding: 0 20px 64px; }
    .hero-banner { background: linear-gradient(135deg, #111, #3a3a3a); color: #fff; padding: 32px; display: grid; grid-template-columns: 1.3fr .7fr; gap: 22px; align-items: center; }
    .hero-banner h1 { font-size: clamp(36px, 5vw, 62px); line-height: .95; font-family: var(--serif, Georgia, serif); }
    .hero-banner p { max-width: 52ch; color: rgba(255,255,255,.8); }
    .store-identity { display: flex; align-items: center; gap: 20px; }
    .store-logo { width: 84px; height: 84px; flex: 0 0 84px; object-fit: contain; background: #fff; padding: 8px; }
    .store-categories { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .store-category { padding: 6px 9px; border: 1px solid rgba(255,255,255,.35); color: #fff; font-size: 11px; }
    .store-contacts { display: grid; gap: 7px; margin-top: 14px; }
    .store-contacts a { color: #fff; overflow-wrap: anywhere; }
    .storefront-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; margin-top: 28px; }
    .product-card { background: #fff; border: 1px solid rgba(17,17,17,.08); padding: 16px; }
    .product-card img { width: 100%; height: 220px; object-fit: cover; margin-bottom: 14px; display: block; background: #e5e1d8; }
    .product-card h3 { font-size: 20px; margin: 6px 0; }
    .product-card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
    .meta strong { font-size: 18px; }
    .muted { color: #6a6a6a; }
    .status-pill { display: inline-flex; align-items: center; padding: 7px 10px; border-radius: 999px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
    .status-pill.good { background: rgba(27,117,75,.09); color: #1b754b; }
    .status-pill.neutral { background: rgba(17,17,17,.08); color: #333; }
    @media (max-width: 820px) { .hero-banner, .storefront-grid { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { .store-identity { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <div class="storefront-shell">
    <header class="site-header" style="margin-bottom: 18px;">
      <a class="brand" href="index.html" aria-label="LEXORA home"><span class="brand-mark">L</span><span>LEXORA</span></a>
      <nav class="desktop-nav" aria-label="Primary navigation"><a href="shop.html">Shop</a><a href="index.html#suppliers">Suppliers</a><a href="index.html#wholesale">Wholesale</a></nav>
      <div class="header-actions"><a class="text-button" href="index.html">Back to marketplace ↗</a></div>
    </header>

    <section id="storefrontContent"></section>
  </div>

  <script src="supplier-storefront.js?v=supplier-profile-20260927-r1"></script>
</body>
</html>
